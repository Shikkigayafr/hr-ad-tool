# Раз в неделю предлагает обновления зависимостей отдельными pull request'ами.
# Версии в requirements.txt закреплены, поэтому обновления приходят только так — и проходят через CI.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
