version: '3.8'

services:
  hr-ad-panel:
    build: .
    container_name: hr_ad_panel
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    # Монтируем папки, чтобы база данных и аватарки сохранялись между перезапусками
    volumes:
      - ./instance:/app/instance
      - ./static/avatars:/app/static/avatars
    restart: unless-stopped