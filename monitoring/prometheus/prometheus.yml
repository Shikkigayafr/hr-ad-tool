# Prometheus для HR-панели. Запуск: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hrpanel
    metrics_path: /metrics
    # Токен лежит в Docker secret (secrets/metrics_token.txt), в конфиг он не попадает
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["hr-ad-panel:5000"]
