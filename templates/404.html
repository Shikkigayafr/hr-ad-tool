{% extends "base.html" %}

{% block content %}
    <div style="text-align: center; padding: 60px 20px;">
        <h1 style="font-size: 80px; margin: 0; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
        <h2 style="font-size: 24px; margin-top: 10px; color: var(--text);">Страница не найдена</h2>
        <p style="color: var(--text-muted); margin-bottom: 30px;">Возможно, она была удалена или вы ошиблись в адресе.</p>
        <a href="/" class="btn-block" style="display: inline-block; width: auto; padding: 12px 30px; text-decoration: none;">Вернуться на главную</a>
    </div>
{% endblock %}
