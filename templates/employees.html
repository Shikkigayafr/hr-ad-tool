{% extends "base.html" %}

{% block content %}
    <h1>Список сотрудников</h1>
    <table id="emp-table">
        <thead>
            <tr>
                <th>ФИО</th>
                <th>Роль</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="emp-body">
            <!-- Сюда JS будет вставлять строки -->
        </tbody>
    </table>
{% endblock %}

{% block scripts %}
<script>
    async function loadEmployees() {
        const res = await fetch('/api/employees');
        const data = await res.json();
        if (!data.ok) {
            window.location.href = '/'; // Если не залогинен
            return;
        }

        const tbody = document.getElementById('emp-body');
        tbody.innerHTML = '';

        data.employees.forEach(emp => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${emp.full_name}</td>
                <td>${emp.role}</td>
                <td>
                    <button class="btn-small" onclick="promoteEmp(${emp.id})">Повысить</button>
                    <button class="btn-small btn-danger" onclick="deleteEmp(${emp.id}, '${emp.full_name}')">Удалить</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function promoteEmp(id) {
        const res = await fetch(`/api/employee/${id}/promote`, {method: 'POST'});
        const data = await res.json();
        if(data.ok) { loadEmployees(); } else { alert(data.message); }
    }

    async function deleteEmp(id, name) {
        if(!confirm(`Вы точно хотите удалить сотрудника ${name}?`)) return;
        const res = await fetch(`/api/employee/${id}`, {method: 'DELETE'});
        const data = await res.json();
        if(data.ok) { loadEmployees(); } else { alert(data.message); }
    }

    // Загружаем список при открытии страницы
    loadEmployees();
</script>
{% endblock %}
